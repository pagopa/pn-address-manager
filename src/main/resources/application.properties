logging.config=classpath:logback-base.xml

pn.env.runtime=PROD

spring.application.name=PN-ADDRESS-MANAGER

pn.address-manager.health-check-path = ${PN_ADDRESSMANAGER_HEALTHCHECKPATH:/actuator/health}
pn.address-manager.pago-pa-cx-id = ${PN_ADDRESSMANAGER_PAGOPACXID:pn-address-manager}
pn.address-manager.eventbus.name = ${PN_ADDRESSMANAGER_EVENTBUS:default}
pn.address-manager.eventbus.detail-type = AddressManagerOutcomeEvent
pn.address-manager.eventbus.source = pn-address-manager

pn.address-manager.csv.path-country = ${PN_ADDRESSMANAGER_COUNTRIESCSV:PagoPA-Lista-Nazioni.csv}
pn.address-manager.csv.path-cap = ${PN_ADDRESSMANAGER_CAPCSV:PagoPA-ListaCLP.csv}

pn.address-manager.flag-csv = ${PN_ADDRESSMANAGER_FLAGCSV:false}
pn.address-manager.enable-whitelisting = ${PN_ADDRESSMANAGER_ENABLEWHITELISTING:true}
pn.address-manager.enable-validation=${PN_ADDRESSMANAGER_ENABLEPATTERNVALIDATION:false}
pn.address-manager.validation-pattern=${PN_ADDRESSMANAGER_VALIDATIONPATTERN:01234567890abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ./ '-}

pn.address-manager.normalizer.batch-request.ttl = ${PN_ADDRESSMANAGER_NORMALIZER_BATCHREQUEST_TTL:262800m}
pn.address-manager.normalizer.postel.working-ttl = ${PN_ADDRESSMANAGER_NORMALIZER_POSTEL_WORKINGTTL:7200s}
pn.address-manager.normalizer.postel.ttl = ${PN_ADDRESSMANAGER_NORMALIZER_POSTEL_TTL:604800s}

#Indica il tempo (espresso in millis) che intercorre tra il termine di uno scheduling e l'altro. Nota: se minore di lockAtLeastFor il tempo che passa tra un esecuzione e l'altra sara necessariamente il tempo indicato per quest'ultimo
pn.address-manager.normalizer.batch-request.delay = ${PN_ADDRESSMANAGER_NORMALIZER_BATCHREQUEST_DELAY:138000}

pn.address-manager.normalizer.batch-request.recovery-delay = ${PN_ADDRESSMANAGER_NORMALIZER_BATCHREQUEST_RECOVERYDELAY:120000}
pn.address-manager.normalizer.batch-request.recovery-after = ${PN_ADDRESSMANAGER_NORMALIZER_BATCHREQUEST_RECOVERYAFTER:600}
pn.address-manager.normalizer.batch-request.max-retry = ${PN_ADDRESSMANAGER_NORMALIZER_BATCHREQUEST_MAXRETRY:3}
pn.address-manager.normalizer.batch-request.querymax-size = ${PN_ADDRESSMANAGER_NORMALIZER_BATCHREQUEST_QUERYMAXSIZE:1000}
pn.address-manager.normalizer.batch-request.eventbridge-recovery-delay = ${PN_ADDRESSMANAGER_NORMALIZER_BATCHREQUEST_EVENTBRIDGERECOVERYDELAY:120000}
pn.address-manager.normalizer.postel.recovery-delay =  ${PN_ADDRESSMANAGER_NORMALIZER_POSTEL_RECOVERYDELAY:120000}
pn.address-manager.normalizer.postel.recovery-after = ${PN_ADDRESSMANAGER_NORMALIZER_POSTEL_RECOVERYAFTER:600}
pn.address-manager.normalizer.postel.max-retry = ${PN_ADDRESSMANAGER_NORMALIZER_POSTEL_MAXRETRY:12}
pn.address-manager.normalizer.postel.request-prefix =${PN_ADDRESSMANAGER_NORMALIZER_POSTEL_REQUESTPREFIX}
pn.address-manager.normalizer.batch-clean-request = ${PN_ADDRESSMANAGER_NORMALIZER_BATCHCLEANREQUESTDELAY:120000}
pn.address-manager.normalizer-postel-read-timeout-millis= ${PN_ADDRESSMANAGER_NORMALIZER_POSTEL_CLIENTTIMEOUT:30000}


pn.address-manager.foreign-validation-pattern=${PN_ADDRESS_MANAGER_FOREIGN_VALIDATION_PATTERN:.*}
pn.address-manager.foreign-validation-mode=${PN_ADDRESS_MANAGER_FOREIGN_VALIDATION_MODE:PASSTHROUGH}


management.endpoints.web.exposure.include=health,metrics,loggers

#pn.address-manager.normalizzatore-base-path=https://localhost:8082/SINIHelper
#pn.address-manager.deduplica-base-path=https://localhost:8082/PagoPaDeduplica
pn.address-manager.normalizzatore-base-path=http://localhost:8082
pn.address-manager.deduplica-base-path=http://localhost:8082
pn.address-manager.safe-storage-base-path=http://localhost:8120
pn.address-manager.postel-cx-id=POSTEL
pn.address-manager.address-length-validation=0

# Config NORMALIZZATORE
pn.address-manager.normalizer.postel-auth-key=test
pn.address-manager.normalizer.max-csv-size=10000
#Specifica quanto tempo un determinato nodo puo tenere il lock, utile nel caso in cui un nodo vada down
pn.address-manager.normalizer.batch-request.lock-at-most=138000
#Specifica il tempo minimo in cui un nodo tiene il lock. Utile per evitare l'esecuzione multipla di piu nodo in caso di task molto brevi
pn.address-manager.normalizer.batch-request.lock-at-least=1000
pn.address-manager.normalizer.batch-recovery.lock-at-most=120000
pn.address-manager.normalizer.batch-recovery.lock-at-least=1000
#Indica il tempo (espresso in millis) che intercorre tra il termine di uno scheduling e l'altro. Nota: se minore di lockAtLeastFor il tempo che passa tra un esecuzione e l'altra sara necessariamente il tempo indicato per quest'ultimo
pn.address-manager.normalizer.batch-request.query-max-size=1000

# Config tabelle dynamodb
pn.address-manager.dao.api-key-table-name=addressManager-AnagraficaClient
pn.address-manager.dao.cap-table-name=addressManager-Cap
pn.address-manager.dao.country-table-name=addressManager-Country
pn.address-manager.dao.postel-batch-table-name=addressManager-NormalizzatoreBatch
pn.address-manager.dao.batch-request-table-name=addressManager-PNRequest
pn.address-manager.dao.shedlock-table-name=addressManager-ShedLock

# Config code SQS
pn.address-manager.sqs.input-queue-name=local-address-inputs
pn.address-manager.sqs.input-dlq-queue-name=local-address-inputs-DLQ
pn.address-manager.sqs.callback-queue-name=local-address-callback
pn.address-manager.sqs.callback-dlq-queue-name=local-address-callback-DLQ
pn.address-manager.sqs.tracing-input-queue-name=local-address-tracing-input


# AWS specific configurations
spring.cloud.aws.region.static=${AWS_REGIONCODE:us-east-1}
aws.bucketName=local-doc-bucket
aws.region-code=us-east-1
aws.profile-name=${PN_AWS_PROFILE_NAME:default}
aws.endpoint-url=http://localhost:4566